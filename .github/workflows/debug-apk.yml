name: Debug APK

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: debug-apk-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-debug-apk:
        name: Build debug APK
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: "temurin"

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Build foss debug APK
              run: ./gradlew assembleFossDebug

            - name: Build gplay debug APK
              run: ./gradlew assembleGplayDebug

            - name: Upload foss debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: contacts-foss-debug
                  path: app/build/outputs/apk/foss/debug/*.apk
                  if-no-files-found: error

            - name: Upload gplay debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: contacts-gplay-debug
                  path: app/build/outputs/apk/gplay/debug/*.apk
                  if-no-files-found: error
